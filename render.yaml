services:
  # Flask Backend API
  - type: web
    name: sms-spam-detector-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && python download_nltk.py"
    startCommand: "cd backend && gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://sms-spam-detector.onrender.com

  # React Frontend (Static Site)
  - type: static_site
    name: sms-spam-detector-frontend
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sms-spam-detector-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
